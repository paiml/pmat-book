name: Test All Examples

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Weekly, for the one gate that has to RUN the commands rather than parse
    # them. It is too slow and too side-effecting for the PR path, but a gate
    # that never runs is not a gate.
    - cron: '17 5 * * 1'

env:
  # Single source of the pmat under test (read by pmat-pin-freshness.yml). 3.44.0 is the
  # crates.io max_stable_version the floating install resolved when this was pinned.
  PMAT_VERSION: "3.44.0"

jobs:
  documented-commands:
    # POKA-YOKE, not a test: every `pmat` invocation the book PRINTS must resolve
    # against the pmat it documents. One platform, because command existence is
    # not platform-specific. Every PR, because a chapter added without a test is
    # exactly how this book reached 171 unresolvable paths while its own suite
    # was green.
    #
    # A RATCHET — the count may only go down — so it does not block work on a
    # book that is already drifted, and does not let it drift further.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install PMAT
      run: |
        cargo install pmat --version "=${PMAT_VERSION}" --locked
        [ "$(pmat --version | head -n1)" = "pmat ${PMAT_VERSION}" ]
    - name: Gate scripts must be shellcheck-clean
      # Every hazard these gates guard against is a shell hazard. Linting them
      # is not housekeeping, it is the gate on the gates.
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
        make lint-shell

    - name: The flag gate must be able to FAIL
      # Runs BEFORE the gate it validates. A green gate whose ability to go red
      # was never demonstrated is exactly the MOCK_MODE defect this book already
      # shipped once: 88 assertions, green, measuring nothing. If this step
      # fails, the result of the next two proves nothing.
      run: make test-flags-selftest

    - name: Every documented command must exist
      run: bash scripts/verify-documented-commands.sh

    - name: Every documented command must PARSE
      # POKA-YOKE II. The step above proves `pmat analyze tdg` is a real
      # subcommand; this one proves `pmat analyze tdg .` is not a real way to
      # call it. Hermetic — it appends `--help`, so nothing is executed — and
      # it finishes in seconds, which is why it can sit on the PR path.
      run: make test-flags

  documented-flags-deep:
    # The same corpus, RUN rather than parsed, in a throwaway directory.
    #
    # It is here and not in `documented-commands` because of a measurement, not
    # a hunch. Against a frozen snapshot of the book, over the 1,120 commands
    # both modes probe, `--execute` found 412 parse failures and `--help`
    # probing found 401. The 11-command difference is entirely
    # missing-required-argument and missing-subcommand — the one class clap
    # short-circuits past when it sees `--help`. In the other direction the
    # difference is zero: parse mode misses nothing else.
    #
    # 11 extra findings do not justify putting 285 real analysis runs, 4
    # timeouts and a denylist of servers and daemons on every pull request. They
    # do justify a weekly sweep.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install PMAT
      run: |
        cargo install pmat --version "=${PMAT_VERSION}" --locked
        [ "$(pmat --version | head -n1)" = "pmat ${PMAT_VERSION}" ]
    - name: Run every documented command for real
      run: bash scripts/verify-documented-flags.sh --execute --jobs 4 --budget 2700

  # One build + one test job per OS, with NO edge between OSes: a slow or failed
  # build on one OS holds back only that OS's 8 cells. (A `needs` on a matrix job
  # waits for every leg, so a single matrix build would couple all three OSes.)
  # pmat is compiled once per OS instead of once per cell (windows: 8 -> 1).
  # A failed build is red on pmat-build-<os>, and its 8 cells go red too: their first step fails unless the build succeeded.
  # If checks are ever made required, require the three pmat-build-* jobs too
  # (a build job that is skipped or cancelled must not read as passing).
  pmat-build-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # the compile used to sit inside the 20 min cell limit; measured max compile 1193 s (windows)
    permissions:
      contents: read
    steps:
    - name: Build PMAT
      shell: bash
      run: |
        cargo install pmat --version "=${PMAT_VERSION}" --locked --root "$GITHUB_WORKSPACE/pmat-root"
        [ "$("$GITHUB_WORKSPACE/pmat-root/bin/pmat" --version | head -n1)" = "pmat ${PMAT_VERSION}" ]
    - uses: actions/upload-artifact@v4
      with:
        name: pmat-ubuntu-latest
        path: pmat-root/bin
        if-no-files-found: error

  test-ubuntu:
    # Name kept identical to the old matrix job's check name.
    name: test-examples (ubuntu-latest, ${{ matrix.chapter }})
    needs: pmat-build-ubuntu
    if: ${{ !cancelled() }}  # a failed build must turn these cells RED (first step), not leave them skipped
    runs-on: ubuntu-latest
    timeout-minutes: 10  # tests only (the compile now has its own job). Was 20 min over install + tests; measured test step max 10 s
    permissions:
      contents: read
    strategy:
      matrix:
        chapter: [ch01, ch02, ch03, ch04, ch05, ch06, ch07, ch08]
    steps:
    - name: Fail unless the pmat build for ubuntu succeeded
      shell: bash
      env:
        BUILD_RESULT: ${{ needs.pmat-build-ubuntu.result }}
      run: |
        if [ "$BUILD_RESULT" != success ]; then
          echo "::error::pmat build for ubuntu failed (result: $BUILD_RESULT)"
          exit 1
        fi

    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: pmat-ubuntu-latest
        path: .pmat-bin

    - name: Put the built PMAT on PATH
      shell: bash
      run: |
        chmod +x .pmat-bin/pmat*
        echo "$GITHUB_WORKSPACE/.pmat-bin" >> "$GITHUB_PATH"

    - name: Check PMAT version
      shell: bash
      run: '[ "$(pmat --version | head -n1)" = "pmat ${PMAT_VERSION}" ]'

    - name: Run chapter tests
      run: |
        make test-${{ matrix.chapter }}

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        # v4 requires artifact names unique across the WHOLE run: 3 OS x 8 chapters.
        name: test-results-ubuntu-latest-${{ matrix.chapter }}
        path: test-results/

  pmat-build-macos:
    runs-on: macos-latest
    timeout-minutes: 30  # the compile used to sit inside the 20 min cell limit; measured max compile 1193 s (windows)
    permissions:
      contents: read
    steps:
    - name: Build PMAT
      shell: bash
      run: |
        cargo install pmat --version "=${PMAT_VERSION}" --locked --root "$GITHUB_WORKSPACE/pmat-root"
        [ "$("$GITHUB_WORKSPACE/pmat-root/bin/pmat" --version | head -n1)" = "pmat ${PMAT_VERSION}" ]
    - uses: actions/upload-artifact@v4
      with:
        name: pmat-macos-latest
        path: pmat-root/bin
        if-no-files-found: error

  test-macos:
    # Name kept identical to the old matrix job's check name.
    name: test-examples (macos-latest, ${{ matrix.chapter }})
    needs: pmat-build-macos
    if: ${{ !cancelled() }}  # a failed build must turn these cells RED (first step), not leave them skipped
    runs-on: macos-latest
    timeout-minutes: 10  # tests only (the compile now has its own job). Was 20 min over install + tests; measured test step max 10 s
    permissions:
      contents: read
    strategy:
      matrix:
        chapter: [ch01, ch02, ch03, ch04, ch05, ch06, ch07, ch08]
    steps:
    - name: Fail unless the pmat build for macos succeeded
      shell: bash
      env:
        BUILD_RESULT: ${{ needs.pmat-build-macos.result }}
      run: |
        if [ "$BUILD_RESULT" != success ]; then
          echo "::error::pmat build for macos failed (result: $BUILD_RESULT)"
          exit 1
        fi

    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: pmat-macos-latest
        path: .pmat-bin

    - name: Put the built PMAT on PATH
      shell: bash
      run: |
        chmod +x .pmat-bin/pmat*
        echo "$GITHUB_WORKSPACE/.pmat-bin" >> "$GITHUB_PATH"

    - name: Check PMAT version
      shell: bash
      run: '[ "$(pmat --version | head -n1)" = "pmat ${PMAT_VERSION}" ]'

    - name: Run chapter tests
      run: |
        make test-${{ matrix.chapter }}

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        # v4 requires artifact names unique across the WHOLE run: 3 OS x 8 chapters.
        name: test-results-macos-latest-${{ matrix.chapter }}
        path: test-results/

  pmat-build-windows:
    runs-on: windows-latest
    timeout-minutes: 30  # the compile used to sit inside the 20 min cell limit; measured max compile 1193 s (windows)
    permissions:
      contents: read
    steps:
    - name: Build PMAT
      shell: bash
      run: |
        cargo install pmat --version "=${PMAT_VERSION}" --locked --root "$GITHUB_WORKSPACE/pmat-root"
        [ "$("$GITHUB_WORKSPACE/pmat-root/bin/pmat" --version | head -n1)" = "pmat ${PMAT_VERSION}" ]
    - uses: actions/upload-artifact@v4
      with:
        name: pmat-windows-latest
        path: pmat-root/bin
        if-no-files-found: error

  test-windows:
    # Name kept identical to the old matrix job's check name.
    name: test-examples (windows-latest, ${{ matrix.chapter }})
    needs: pmat-build-windows
    if: ${{ !cancelled() }}  # a failed build must turn these cells RED (first step), not leave them skipped
    runs-on: windows-latest
    timeout-minutes: 10  # tests only (the compile now has its own job). Was 20 min over install + tests; measured test step max 10 s
    permissions:
      contents: read
    strategy:
      matrix:
        chapter: [ch01, ch02, ch03, ch04, ch05, ch06, ch07, ch08]
    steps:
    - name: Fail unless the pmat build for windows succeeded
      shell: bash
      env:
        BUILD_RESULT: ${{ needs.pmat-build-windows.result }}
      run: |
        if [ "$BUILD_RESULT" != success ]; then
          echo "::error::pmat build for windows failed (result: $BUILD_RESULT)"
          exit 1
        fi

    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: pmat-windows-latest
        path: .pmat-bin

    - name: Put the built PMAT on PATH
      shell: bash
      run: |
        chmod +x .pmat-bin/pmat*
        echo "$GITHUB_WORKSPACE/.pmat-bin" >> "$GITHUB_PATH"

    - name: Check PMAT version
      shell: bash
      run: '[ "$(pmat --version | head -n1)" = "pmat ${PMAT_VERSION}" ]'

    - name: Run chapter tests
      run: |
        make test-${{ matrix.chapter }}

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        # v4 requires artifact names unique across the WHOLE run: 3 OS x 8 chapters.
        name: test-results-windows-latest-${{ matrix.chapter }}
        path: test-results/

  dogfood-pmat:
    runs-on: ubuntu-latest
    needs: [test-ubuntu, test-macos, test-windows]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install PMAT
      run: |
        cargo install pmat --version "=${PMAT_VERSION}" --locked
        [ "$(pmat --version | head -n1)" = "pmat ${PMAT_VERSION}" ]
    
    - name: Analyze book codebase with PMAT
      run: |
        pmat analyze comprehensive -p . --format json > pmat-analysis.json
        pmat tdg . --format json > pmat-tdg.json
        pmat analyze duplicates -p . --format json > pmat-similarity.json
    
    - name: Check quality gates
      run: |
        # Extract grade from TDG analysis
        GRADE=$(jq -r '.score.grade' pmat-tdg.json)
        echo "Code Quality Grade: $GRADE"
        
        # Rank the letter grade. String comparison is wrong here: "A-" < "B"
        # lexically, so the best grade failed. Unknown or null fails closed (-1).
        rank() {
          case "$1" in
            A+) echo 12;; A) echo 11;; A-) echo 10;;
            B+) echo 9;;  B) echo 8;;  B-) echo 7;;
            C+) echo 6;;  C) echo 5;;  C-) echo 4;;
            D+) echo 3;;  D) echo 2;;  D-) echo 1;;
            F) echo 0;;   *) echo -1;;
          esac
        }
        # Fail if grade is below B
        if [ "$(rank "$GRADE")" -lt 8 ]; then
          echo "❌ Quality gate failed: Grade $GRADE is below B"
          exit 1
        fi
        
        echo "✅ Quality gate passed: Grade $GRADE"
    
    - name: Generate quality report
      run: |
        echo "# PMAT Quality Report" > quality-report.md
        echo "" >> quality-report.md
        echo "## Analysis Summary" >> quality-report.md
        jq -r '"- Files: \(.summary.total_files)\n- Issues: \(.summary.total_issues)\n- Quality score: \(.summary.quality_score)"' pmat-analysis.json >> quality-report.md
        echo "" >> quality-report.md
        echo "## Technical Debt Grade" >> quality-report.md
        jq -r '"- Grade: \(.score.grade)\n- Score: \(.score.total)"' pmat-tdg.json >> quality-report.md
        echo "" >> quality-report.md
        echo "## Code Similarity" >> quality-report.md
        jq -r '"- Duplicates Found: \(.total_duplicates)\n- Duplication: \(.duplication_percentage)%"' pmat-similarity.json >> quality-report.md
    
    - name: Upload PMAT reports
      uses: actions/upload-artifact@v4
      with:
        name: pmat-reports
        path: |
          pmat-*.json
          quality-report.md
    
    - name: Comment PR with quality report
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const report = fs.readFileSync('quality-report.md', 'utf8');
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: report
          });
  
  build-book:
    runs-on: ubuntu-latest
    needs: [test-ubuntu, test-macos, test-windows, dogfood-pmat]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install mdBook
      run: |
        cargo install mdbook
        cargo install mdbook-linkcheck
    
    - name: Build book
      run: make build
    
    - name: Upload book artifact
      uses: actions/upload-artifact@v4
      with:
        name: book
        path: book/
