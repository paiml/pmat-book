- id: PMAT-020
  github_issue: 20
  item_type: task
  title: ch04-01-tdg.md documents only flags and subcommands pmat accepts, and its CI gate can fail
  status: inprogress
  priority: medium
  assigned_to: null
  created: 2026-10-06T23:49:52Z
  updated: 2026-10-06T23:49:57.173814611+00:00
  spec: null
  acceptance_criteria:
  - "GH-20: src/ch04-01-tdg.md names no flag or subcommand that pmat 3.42.0 rejects. Removed (each exits 2): --storage-backend, --priority, --incremental, --cache-enabled, --compare-baseline, --trend, --period, --parallel, --config, quality-gate --tdg-threshold/--min-grade/--fail-on-regression. Removed: tdg performance-profile and tdg flame-graph, which pmat tdg --help does not list (pmat tdg reads the word as a path and exits 5). tests/ch04/test_tdg.sh asserts each of these against real pmat"
  - "--ml (exit 1, not implemented) is removed, and the chapter states that analyze tdg accepts but does not apply --threshold and exits 0"
  - "The CI 'Check TDG Grades' step is pmat tdg check-quality --path . --min-grade B, which exits 1 on a violation (measured with --min-grade A+ on a fixture); baseline create/compare and check-regression --fail-on-regression run (exit 0)"
  - "The CI gate in the title is the chapter's documented GitHub Actions step. tests/ch04/test_tdg.sh Test 5b runs every documented command against real pmat whenever a pmat binary exists (54 pass, 0 fail on 3.42.0, including the default allowance passing a 100-to-96 drop, with Tests 2-5 now run against real pmat because MOCK_MODE is set false when pmat is on PATH, including history --range/--path/--format json/--commit after a capture, and check-regression --max-score-drop 0 exiting 1 on a regressed tree; each removed flag is matched by clap's \"unexpected argument\" text, and a mutant passing --format x, a real flag with a bad value, goes red). On the suite's own fixture tree (with high_complexity.py) --min-grade F exits 0, A+ exits 1 and analyze tdg still exits 0, so the step can fail and analyze tdg alone cannot. A mutant expecting A+ to pass goes red. The book's CI installs no pmat and prints SKIP; TDG_REQUIRE_PMAT=1 turns the skip into a failure (measured)"
  - "Builds on #10's branch (fix/10-analyze-subcommands, merged in): every analyze tdg example uses -p, so #10 lands first. Out of scope: Example 3's jq reads a .components.churn field the JSON output does not have; pmat tdg <file> --with-git-context does not record the commit for history --commit, while pmat tdg . does (pmat defect, paiml/paiml-mcp-agent-toolkit#1476)"
  phases: []
