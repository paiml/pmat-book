roadmap:
- id: PMAT-010
  github_issue: 10
  item_type: task
  title: 'Every printed pmat analyze <path> command parses: a subcommand plus -p/--path (or --file), no invented flags'
  status: planned
  priority: medium
  assigned_to: null
  created: 2026-10-05T22:06:51Z
  updated: 2026-10-05T22:06:51Z
  spec: null
  acceptance_criteria:
  - ~130 printed `pmat analyze <path>` commands exit 2 on pmat 3.42.
  - Every printed `pmat analyze <path>` form outside ch30 (split to issue 61, see below) - bare (`pmat analyze .`) or after a subcommand (`pmat analyze complexity .`, `pmat analyze tdg src/legacy/`) - now parses on pmat 3.42.0 (no clap exit 2); a subcommand is always named and the path goes in -p/--path (or --file for one file).
  - Bare `pmat analyze <path>` maps to `pmat analyze comprehensive -p <path>`; `--detailed`/`--summary` map to `--format detailed`/`--format summary`.
  - A flag no pmat release has (e.g. --microservices-analysis, --max-memory, --storage-backend, --trend --period, --rules, --sample, --languages) is dropped, or its line is replaced by the real command that does the job; only the immediately adjacent sentence or comment is changed where it claimed the invented flag. No new sections, no rewritten chapters.
  - A command that parses but returns non-zero because the analysis has nothing to measure (an empty example dir, a placeholder path) is acceptable; `pmat analyze tdg --ml` stays although pmat reports it unimplemented, because the flag parses.
  - 'Verified against `pmat <cmd> --help` on pmat 3.42.0 (a command new to the book is not an invented one) - `analyze comprehensive` has --file <one file>, --include <glob> and --format summary|detailed|markdown; `analyze defects` formats are text|json|junit only, so CSV examples use `analyze defect-prediction --format csv` (a comment above each says so); `analyze dag`, `analyze hardcoded-paths` and `analyze graph-metrics` are real subcommands; `tdg history --since`, `tdg baseline create --path --output` and `tdg baseline compare --baseline --path` exist. All rewritten commands were run - 0 exit 2.'
  - A heading or comment that named an invented feature loses only that word (e.g. "Incremental CI/CD Analysis" becomes "CI/CD Analysis").
  - ch30 is split out of this ticket and left unchanged: its commands, Command Tested labels and Verified Output JSON change together under issue 61, so no command is shown beside output it does not produce. Measured on pmat 3.42.0 with --help appended, exit 0: `analyze complexity --project-path .` (an accepted alias, left as printed) and `quality-gate --checks complexity,dead-code,satd` (already used in ch07). Long flags (--output, --path, --baseline) are used where the book already does.
  - 'Executed on pmat 3.42.0 (exit codes, not --help) - `pmat tdg baseline create --path src --output b.json` 0; `pmat tdg baseline compare --baseline b.json --path src` 0; `pmat tdg history --since HEAD~5` 0. These are existing pmat tdg subcommands, already used unchanged in ch04-02-tdg-enforcement.md and ch73. `pmat tdg <path> --config <file>` parses; it is the only form with --config (`pmat analyze tdg` has none), so it is not a shorthand for `pmat analyze tdg -p`.'
  - 'Out of scope - the ch04-01 Example 2 TOML body: pmat rejects its `[tdg.weights]` schema (`missing field weights`), a sample-content defect recorded on issue 60; this ticket fixes the command line only.'
  - 'The two test scripts a changed "Command Tested" label names get the same command rewrite, so each label names what its test runs - tests/ch01/test_02_first_analysis.sh (8 lines) and tests/ch04/test_tdg.sh (7 lines). Measured - ch04 exits 0 before and after; ch01 exits 2 on main (commands do not parse) and 1 on this branch (5 output-shape assertions on fields pmat 3.42 does not emit, issue 61).'
  - '`-p`, `--path` and `--file` are all accepted: `-p` is the short form of `--path`, and `--file` is the single-file form of comprehensive, complexity and defects (pmat 3.42.0 --help). `comprehensive --include` and `--exclude` take a glob ("Include/Exclude file patterns"). `pmat tdg history --since <ref>` is the real trend command (`pmat tdg history --help`).'
  - '`pmat analyze satd` filters with --severity (pmat 3.42.0 `satd --help`); the book''s older `satd --priority` example is itself an invented flag and is listed in issue 60, so it is not the reference form.'
  - 'Where a printed command writes to a `.json` file, `--format json` is added: without it `pmat analyze comprehensive --output x.json` writes the plain-text report (measured), so the file would not be JSON (ch18 book-analysis.json).'
  - Where an invented flag had no faithful real equivalent it is dropped with its lines (the "Multiple metrics" --metrics example; in ch04-01 "Advanced Features" the --storage-backend sled and --incremental --cache-enabled lines, while the critical-path line keeps its path and loses --priority; the --config-consistency line) and a list that described an output PMAT does not produce (the HTML report "Features") is removed with it.
  - Out of scope, unchanged - sample output blocks (CSV samples, jq field paths), the output-shape assertions in test scripts (issue 61), test scripts other than the two below, and the 44 commands that name a subcommand or flag pmat does not have without a positional path (architecture, security, similarity, wasm flags...); those are measured and listed in issue 60.
