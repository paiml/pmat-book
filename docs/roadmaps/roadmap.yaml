roadmap:
- id: PMAT-005
  github_issue: 5
  item_type: task
  title: 'Every Chapter N page H1 and [Chapter N](page.md) link label matches the SUMMARY.md number, enforced in CI'
  status: planned
  priority: medium
  assigned_to: null
  created: 2026-10-06T12:32:16Z
  phases: []
  subtasks: []
  estimated_effort: null
  labels:
  - kind:docs
  notes: null
  acceptance_criteria:
  - 'Direction is the issue''s Option B: the six page H1s move to the SUMMARY.md number (ch09-00-precommit-hooks 9->10, ch10-00-auto-clippy 10->11, ch11-00-custom-rules 11->12, ch12-00-architecture 12->13, ch13-00-language-examples 13->14, ch14-00-qdd 14->27). No file is renamed, so no URL changes. Option A would leave two chapters claiming Chapter 9.'
  - 'Nine [Chapter N: ...](page.md) labels in ch04-02, ch05-00 (2), ch08-00, ch09-00, ch10-00 (2), ch11-00 and ch34-00 now carry the SUMMARY.md number of the page they target.'
  - 'scripts/check-chapter-numbers.sh (POSIX sh, no Python) checks every Chapter N a reader sees. The H1 of every listed page must match; an indented sub-entry carries its parent number, so ch04-02 "# Chapter 4.2" must start with 4. Every [Chapter N...](page.md) label in src/ is checked, with or without a colon, decimal (Chapter 13.2) or anchored (page.md#section).'
  - 'A label fails when its page does not exist (DEAD), when its page exists but SUMMARY.md does not list it, or when its number differs. Nothing is skipped. It exits 1 on any mismatch, and 2 when nothing was compared or SUMMARY.md holds a [Chapter entry that is not a top-level "- [Chapter N: ...]" line.'
  - 'Measured on origin/main src/: 15 mismatches, the 6 H1s and 9 labels above, plus 17 DEAD labels; exit 1.'
  - 'Merge order: after fix/4-dead-in-prose-links (issue 4), which deletes or retargets every DEAD label. On this branch alone the check exits 1 with the 17 DEAD labels and 0 other mismatches. Measured on main + fix/4 + this branch, conflicts in ch09/ch10/ch11 resolved as fix/4''s lines plus this branch''s H1s: 157 comparisons, 0 mismatches, exit 0.'
  - 'Each planted defect on that merged tree exits 1 with 1 mismatch: sub-page H1 4.2->5.2, colonless label 67->68, decimal label 9->8.1, anchor label 5->6. Indenting the SUMMARY.md Chapter 3 entry exits 2.'
  - 'An entry SUMMARY.md gives no number is stored as "-", not an empty field that tab-IFS read would collapse to 0. Measured: an unnumbered intro.md whose H1 says Chapter 0 passed the previous version (exit 0) and fails this one (exit 1).'
  - 'Out of scope: "Chapter N" in running prose that is not an H1 or a link label.'
  - 'It runs in CI as a step of the test.yml build job before Build book, and locally from make lint.'
